<!doctype html>
<html lang="ru" data-theme="classic" data-scale="medium">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Документ</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/table.css">
<link rel="stylesheet" href="/css/deck-styles.css">
<link rel="stylesheet" href="/css/cards.css">
<link rel="stylesheet" href="/css/overlays.css">
</head>
<body>

<!-- 🎬 SPLASH: логотип → название → 4 масти → свечение → меню -->
<div id="splash" class="splash">

  <!-- Фон — плавающие символы (как в welcome) -->
  <div class="splash-bg">
    <div class="splash-float sf1">♠</div>
    <div class="splash-float sf2">♥</div>
    <div class="splash-float sf3">♦</div>
    <div class="splash-float sf4">♣</div>
    <div class="splash-float sf5">A</div>
    <div class="splash-float sf6">K</div>
  </div>

  <!-- Контент -->
  <div class="splash-content">

    <!-- Логотип -->
    <div class="splash-logo-wrap">
      <div class="splash-logo-glow"></div>
      <img src="/logo.png" class="splash-logo" alt="Документ">
    </div>

    <!-- Название -->
    <div class="splash-title">ДОКУМЕНТ</div>

    <!-- 4 масти под названием -->
    <div class="splash-suits">
      <div class="suit-inline si-1">♠</div>
      <div class="suit-inline si-2">♥</div>
      <div class="suit-inline si-3">♦</div>
      <div class="suit-inline si-4">♣</div>
    </div>

    <!-- Подпись -->
    <div class="splash-sub">Карточная игра · 2×2</div>

  </div>

  <!-- Вспышка свечения в финале -->
  <div class="splash-flash" id="splashFlash"></div>

</div>

<div id="app"></div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
