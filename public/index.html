<!doctype html>
<html lang="ru" data-theme="classic" data-scale="medium">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Документ</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/table.css">
<link rel="stylesheet" href="/css/deck-styles.css">
<link rel="stylesheet" href="/css/cards.css">
<link rel="stylesheet" href="/css/overlays.css">
</head>
<body>

<!-- 🎬 SPLASH: 4 масти из углов → центр → БУМ → логотип -->
<div id="splash" class="splash">

  <!-- 4 масти по углам -->
  <div class="splash-suits">
    <div class="suit s-tl">♠</div>
    <div class="suit s-tr">♥</div>
    <div class="suit s-bl">♦</div>
    <div class="suit s-br">♣</div>
  </div>

  <!-- Взрыв -->
  <div class="splash-boom" id="splashBoom">
    <div class="splash-flash"></div>
  </div>

  <!-- Логотип + название -->
  <div class="splash-content">
    <img src="/logo.png" class="splash-logo" alt="Документ">
    <div class="splash-title">Документ</div>
    <div class="splash-sub">Карточная игра · 2×2</div>
  </div>

</div>

<div id="app"></div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
