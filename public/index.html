<!doctype html>
<html lang="ru" data-theme="classic" data-scale="medium">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Документ</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/table.css">
<link rel="stylesheet" href="/css/deck-styles.css">
<link rel="stylesheet" href="/css/cards.css">
<link rel="stylesheet" href="/css/overlays.css">
</head>
<body>

<!-- 🎬 SPLASH: падающие карты → сбор в колоду → название -->
<div id="splash" class="splash">
  <div class="splash-inner">

    <div class="splash-ranks" id="splashRanks">
      <div class="sr" style="--i:0; --r:-8deg">A<span class="suit black">♠</span></div>
      <div class="sr" style="--i:1; --r:5deg">K<span class="suit red">♥</span></div>
      <div class="sr" style="--i:2; --r:-3deg">Q<span class="suit red">♦</span></div>
      <div class="sr" style="--i:3; --r:9deg">J<span class="suit black">♣</span></div>
      <div class="sr" style="--i:4; --r:-5deg" data-rank="10">10<span class="suit black">♠</span></div>
      <div class="sr" style="--i:5; --r:6deg">9<span class="suit red">♥</span></div>
      <div class="sr" style="--i:6; --r:-7deg">8<span class="suit red">♦</span></div>
      <div class="sr" style="--i:7; --r:4deg">7<span class="suit black">♣</span></div>
      <div class="sr" style="--i:8; --r:-2deg">6<span class="suit black">♠</span></div>
    </div>

    <div class="splash-title">Документ</div>
    <div class="splash-sub">Карточная игра · 2×2</div>

  </div>
</div>

<div id="app"></div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
